<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WireGuard Client - 登入</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#1e293b;border-radius:10px;padding:32px;width:340px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,.4)}
h1{font-size:1.2rem;text-align:center;margin-bottom:24px;color:#f1f5f9}
label{display:block;font-size:.82rem;color:#94a3b8;margin-bottom:4px}
input[type=text],input[type=password]{width:100%;padding:10px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9rem;margin-bottom:14px}
button{width:100%;padding:10px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:.9rem;font-weight:500;cursor:pointer;transition:background .15s}
button:hover{background:#2563eb}
.flash{padding:8px 12px;border-radius:6px;margin-bottom:14px;font-size:.82rem;background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;text-align:center}
.icon{text-align:center;font-size:2rem;margin-bottom:12px}
</style>
</head>
<body>
<div class="login-box">
<div class="icon">&#128274;</div>
<h1>WireGuard Client 管理</h1>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="flash">{{ msg }}</div>
{% endfor %}
{% endwith %}
<form method="post">
<label>帳號</label>
<input type="text" name="username" autofocus>
<label>密碼</label>
<input type="password" name="password">
<button type="submit">&#10148; 登入</button>
</form>
</div>
</body>
</html>
