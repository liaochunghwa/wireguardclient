services:
  wireguard-client:
    build: ./wireguard-client
    container_name: wireguard-client
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DATA_DIR:-./data}:/config
    environment:
      - SERVERMODE=off
      - PUID=0
      - PGID=0
      - TZ=${TZ:-Asia/Taipei}
    restart: unless-stopped

  wireguard-ui:
    build: ./wireguard-ui
    container_name: wireguard-ui
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DATA_DIR:-./data}:/config
    environment:
      - WG_CONF_DIR=/config/wg_confs
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-wireguard}
      - SECRET_KEY=${SECRET_KEY:-wg-ui-2026}
      - WG_UI_PORT=${WG_UI_PORT:-5080}
    depends_on:
      - wireguard-client
    restart: unless-stopped
